name: publish-ghcr

# Build the container image and publish it to GitHub Container Registry (ghcr.io),
# then run the just-built image once as a smoke test.
#
# Author: 晨星

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: build, push, run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cjx0712/hyperion-ai:latest
            ghcr.io/cjx0712/hyperion-ai:${{ github.sha }}

      - name: Smoke test - run the published image
        continue-on-error: true
        run: |
          docker run -d --name smoke ghcr.io/cjx0712/hyperion-ai:latest || true
          sleep 20
          echo "----- docker ps -----"
          docker ps -a || true
          echo "----- container logs -----"
          docker logs smoke 2>&1 | tail -40 || true
          docker rm -f smoke || true

      - name: Set package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "users/cjx0712/packages/container/hyperion-ai/visibility" -f visibility=public \
            && echo "package is public" \
            || echo "visibility patch failed"
