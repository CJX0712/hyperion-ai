name: publish-ghcr

# Build a multi-arch image and publish it to GitHub Container Registry
# (ghcr.io), then smoke-run it.
#
# v2: QEMU + linux/amd64 + linux/arm64, semver tags, GHA layer cache,
#     guaranteed smoke-test cleanup.
#
# Author: 晨星

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "目标平台（逗号分隔）"
        required: false
        default: "linux/amd64,linux/arm64"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cjx0712/hyperion-ai

jobs:
  publish:
    name: build, push, run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke test - run the published image
        continue-on-error: true
        run: |
          docker run -d --name smoke "$IMAGE:latest" || true
          sleep 20
          echo "----- docker ps -----"; docker ps -a || true
          echo "----- container logs -----"; docker logs smoke 2>&1 | tail -40 || true

      - name: Cleanup smoke container
        if: always()
        continue-on-error: true
        run: docker rm -f smoke || true

      - name: Set package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "users/cjx0712/packages/container/hyperion-ai/visibility" -f visibility=public \
            && echo "package is public" || echo "visibility patch failed"

